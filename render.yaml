services:
  - type: web
    name: forex-alert-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: DEFAULT_FEED_SOURCE
        value: simulation
      - key: PYTHONPATH
        value: /opt/render/project/src
